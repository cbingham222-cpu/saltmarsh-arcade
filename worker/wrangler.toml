name = "saltmarsh-arcade"
main = "worker.js"
compatibility_date = "2026-09-01"

# Create with:  npx wrangler kv namespace create SCORES
# then paste the returned id below.
[[kv_namespaces]]
binding = "SCORES"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# Lock CORS to the GitHub Pages origin once it exists, e.g. "https://<github-user>.github.io"
ALLOWED_ORIGIN = "*"

# Optional Discord webhook (set as a secret, never in this file):
#   npx wrangler secret put DISCORD_WEBHOOK
